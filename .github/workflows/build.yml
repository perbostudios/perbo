name: Build

# The gate is `scripts/check.mjs`. This file runs its stages, one step per
# stage, so the Actions page names the stage that failed and a contributor runs
# the same commands on their own machine. A check is added to a stage there;
# only its step appears here.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a run on the default branch: main would be left with no
  # signal for the merge commit, which is when it matters most.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm

      - name: install
        run: node scripts/check.mjs install

      - name: build
        run: node scripts/check.mjs build

      - name: runtime
        run: node scripts/check.mjs runtime

      - name: code
        run: node scripts/check.mjs code

      # No provider is reached and nothing is spent: `--run` is the flag that
      # would, and this stage never passes it.
      - name: corpus
        run: node scripts/check.mjs corpus

  # The documentation and diagram validators, and the
  # rejection-path tests that prove each one can fail. Every check here
  # corresponds to a mistake that was actually made.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # The local setup entry point is exercised by the Python validation suite.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install validator dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r scripts/requirements-validation.txt

      # `PERBO_PYTHON` names the interpreter the step above installed the
      # validators' dependencies into, rather than whatever `python3` resolves
      # to on the runner.
      - name: validators
        env:
          PERBO_PYTHON: python
        run: node scripts/check.mjs validators

  # A check on every pull request: one that edits a file that judges a change —
  # the reviewer's blocking, remediation and decision-order tests, the
  # runner's security test, and the sample fixtures the reviewer is scored
  # on — fails here, naming the file and the rule it
  # matched. The reviewer's own prompt and code are not on that list: changing
  # them is the contribution invited, carried by a regression score rather than
  # refused by this check. The list lives in `.github/protected-paths.json`; a
  # maintainer's release commit on the default branch is the one path that may
  # change them, and this check does not run against a push to `main`, only
  # against a pull request.
  protected-paths:
    name: protected-paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` rather than a shallow fetch of the two SHAs: the diff
      # below is taken against the merge base, and a shallow fetch of each
      # commit on its own carries no shared ancestry for git to find one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # The two commits named in the pull request's own event payload — never
      # a branch name, and never anything read out of its title, body or diff.
      - name: protected-paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check.mjs protected-paths --base "$BASE_SHA" --head "$HEAD_SHA"

  # The reviewer's regression suite, against the public corpus pinned in
  # `.github/corpus-pin.json` — so a pull request that touches the reviewer
  # cannot silently point the suite at a corpus commit nobody chose. The live
  # run fires for any change under `packages/review/`, a wider net than the
  # obligation D-010 places on the prompt, the blocking matrix and the default
  # model or provider, because a path filter cannot see which change moved the
  # default model.
  #
  # Two steps, and the difference between them is money. The dry run always
  # runs, reaches no provider and costs nothing: it resolves the suite's thirty
  # fixture ids against the cloned corpus and lists them. The live run is
  # thirty reviews on the maintainer's own key — about fifteen dollars a time —
  # so it runs only when the pull request changes the reviewer, and only where
  # the key exists. A pull request from a fork is not given the secret, and a
  # pull request that does not touch `packages/review/` does not need the
  # number, so neither spends anything. `workflow_dispatch` is the maintainer's
  # way to ask for the live run by hand.
  regression-suite:
    name: regression-suite
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` for the same reason the job above needs it: the diff
      # that decides whether the live run happens is taken against the merge
      # base, and a shallow fetch carries no shared ancestry to find one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the evaluation harness
        run: pnpm exec turbo run build --filter=@perbo/evaluation

      - name: Clone the pinned corpus
        run: |
          repository=$(jq -r .repository .github/corpus-pin.json)
          commit=$(jq -r .commit .github/corpus-pin.json)
          git clone --quiet "$repository.git" .corpus
          git -C .corpus checkout --quiet "$commit"

      - name: regression-dry-run
        run: node scripts/check.mjs regression-dry-run --corpus "$PWD/.corpus/fixtures"

      # Both conditions are tested here rather than in an `if:` because a
      # secret cannot be read by a job-level expression at all — it is only
      # ever an environment variable in a step — and because a fork's pull
      # request is not given one, which is the property this relies on rather
      # than works around.
      - name: Decide whether the live suite runs
        id: live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "No ANTHROPIC_API_KEY reaches this job — the live suite does not run, and this"
            echo "pull request costs nothing. That is the expected result on a fork."
            echo "run=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Asked for by hand — the live suite runs."
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The two commits the pull request's own event payload names, and the
          # same merge-base diff `protected-paths.mjs` takes — never a branch
          # name, and never anything read out of the title, body or diff.
          #
          # Written to a file rather than piped into grep on purpose: under
          # `pipefail`, `grep -q` closes the pipe on its first match and git
          # dies of SIGPIPE, so the pipeline reports failure exactly when the
          # reviewer *was* touched — the one case that must not be missed.
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          if grep -q "^packages/review/" changed-files.txt; then
            echo "This pull request changes the reviewer — the live suite runs."
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "This pull request does not touch packages/review/ — the live suite does not run."
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      # Twenty of the thirty fixtures pin a real upstream repository and carry
      # no code of their own; this clones them at the commits they pin. It is
      # only needed by the live run — the dry run resolves ids and never opens
      # a tree.
      - name: Prepare the pinned fixtures
        if: steps.live.outputs.run == 'yes'
        run: node packages/evaluation/dist/main.js prepare --suite regression --corpus "$PWD/.corpus/fixtures"

      # Thirty reviews at one repeat, which is what a suite pass is. The
      # ceiling is a stop, not a budget: a run it halts is recorded as partial,
      # and the delta below refuses to call a partial run a pass.
      - name: Regression suite (live — spends on the maintainer's key)
        if: steps.live.outputs.run == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node packages/evaluation/dist/main.js \
            --suite regression \
            --corpus "$PWD/.corpus/fixtures" \
            --run --repeats 1 --max-spend 40 \
            --out "$PWD/.regression"

      # The delta appears in this job's log whether or not it holds, and a
      # gated metric that no longer meets its threshold fails the job. A change
      # to the reviewer carries its regression score; this is where it is read.
      # The output directory is passed rather than its summary.json so the run
      # records are beside it: under the metric table the delta names every
      # fixture whose answer changed, which is the part a contributor can act
      # on. Naming one does not fail the job — a gated metric does.
      #
      # `--summary` renders the gated rows as a markdown table and appends it to
      # this job's summary page, so a contributor reads what moved on the run's
      # own page rather than by opening a log and finding the right step.
      - name: Regression delta against the recorded score
        if: steps.live.outputs.run == 'yes'
        run: node .github/scripts/regression-delta.mjs "$PWD/.regression" .github/regression-score.json --summary

      # The run itself, kept: the summary the delta read, the per-review records
      # under it, and the artifacts of the reviews. The table above says which
      # metric moved and which fixture changed its answer; this is how the
      # contributor gets at the review that changed it without spending fifteen
      # dollars reproducing the run.
      #
      # `always()`, because the step that most needs its records kept is the one
      # that just failed the job. `include-hidden-files`, because the run
      # directory's name begins with a dot and the action skips hidden paths by
      # default — without it this uploads an empty artifact. `if-no-files-found:
      # error` is the same point said once more: an artifact with nothing in it
      # is worse than no artifact, because it is only found by the person who
      # downloads it expecting the run.
      - name: Upload the regression run
        if: always() && steps.live.outputs.run == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regression-run
          path: .regression
          include-hidden-files: true
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Set up and build the desktop without launching it
        run: node scripts/setup-local.mjs --no-launch

      - name: The CLI on the Node inside Electron
        run: node apps/desktop/scripts/check-runtime.mjs

